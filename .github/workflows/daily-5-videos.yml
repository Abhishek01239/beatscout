# BeatScout — daily autonomous pipeline: 5 CC-licensed visualizers to YouTube.
#
# - Runs at 05:30 UTC every day and publishes when the required secrets exist.
# - Scheduled runs are REAL by default; manual runs stay DRY-RUN by default.
# - Manual "Run workflow" can set dry_run=0 to publish immediately.
# - auto_state.json is committed back so no track is ever published twice.

name: Daily 5 videos

on:
  schedule:
    - cron: "30 5 * * *"          # daily 05:30 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "videos to publish"
        required: false
        default: "5"
      dry_run:
        description: "1 = dry run (no real uploads), 0 = publish"
        required: false
        default: "1"
      genres:
        description: "comma-separated genres"
        required: false
        default: "Lo-fi, Ambient, Electronic"

concurrency:
  group: beatscout-daily
  cancel-in-progress: false

permissions:
  contents: write   # bot commits auto_state.json back to the repo

env:
  # Scheduled runs are live; manual runs default to dry-run unless the user chooses 0.
  DRY_RUN: ${{ github.event_name == 'schedule' && '0' || github.event.inputs.dry_run || '1' }}
  LIMIT: ${{ github.event.inputs.limit || '5' }}
  GENRES: ${{ github.event.inputs.genres || 'Lo-fi, Ambient, Electronic' }}
  JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  # Keep dry-run state isolated so a test run can never consume real dedupe entries.
  STATE_DIR_NAME: ${{ github.event_name == 'schedule' && 'auto-state' || 'auto-state-dry-run' }}
  # Render at 480p @ 24fps with a 60s clip in CI: keeps the 5-video
  # batch comfortably inside the job timeout while staying watchable.
  VIDEO_WIDTH: "854"
  VIDEO_HEIGHT: "480"
  VIDEO_FPS: "24"
  VIDEO_MAX_SECONDS: "60"

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run daily pipeline
        id: pipeline
        env:
          DRY_RUN_FLAG: ${{ env.DRY_RUN == '0' && '--real' || '--dry-run' }}
        run: |
          cd backend
          PROVIDER="$(if [ -n "$JAMENDO_CLIENT_ID" ]; then echo jamendo; else echo synth; fi)"
          echo "provider=$PROVIDER dry_run=$DRY_RUN limit=$LIMIT genres=$GENRES state_dir=$STATE_DIR_NAME"
          python -m app.auto \
            --limit "$LIMIT" \
            --genres "$GENRES" \
            --provider "$PROVIDER" \
            --width "$VIDEO_WIDTH" --height "$VIDEO_HEIGHT" --fps "$VIDEO_FPS" \
            --max-seconds "$VIDEO_MAX_SECONDS" \
            $DRY_RUN_FLAG \
            --state-dir "$GITHUB_WORKSPACE/$STATE_DIR_NAME" \
            --storage "$GITHUB_WORKSPACE/storage/auto"
          echo "summary_done=true" >> "$GITHUB_OUTPUT"

      - name: Commit published state
        if: ${{ always() && env.DRY_RUN == '0' }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -d auto-state ] && git status --porcelain auto-state | grep -q .; then
            git config user.name "beatscout-bot"
            git config user.email "actions@github.com"
            git add auto-state
            git commit -m "chore: update auto-state ($(date -u +%Y-%m-%d))" || true
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi

      - name: Upload videos (artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beatscout-videos-${{ github.run_id }}
          path: storage/auto/media/*.mp4
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          cd backend
          python - <<'EOF'
          import json, glob
          f = glob.glob("../storage/auto/media/*.mp4")
          state = None
          try:
              with open(f"../{__import__('os').environ.get('STATE_DIR_NAME', 'auto-state')}/auto_state.json") as fh:
                  state = json.load(fh)
          except Exception:
              pass
          published = [p for p in (state or {}).get("published", []) if p.get("status") == "published"]
          print("## BeatScout daily run — summary")
          print(f"- videos rendered this run: **{len(f)}**")
          print(f"- published entries in state: **{len(published)}**")
          for p in published[-5:]:
              print(f"  - {p.get('title')} → {p.get('video_url')}")
          EOF
